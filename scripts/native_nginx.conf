# Native (no-Docker) nginx config for testing the frontend at 127.0.0.1:8080, mirroring
# frontend/nginx.conf but pointing at the native backend port (8020, not 8000 — see
# docs/decisions.md) instead of the container DNS name "backend".
worker_processes 1;
pid /mnt/d/WE/data/logs/nginx.pid;
error_log /mnt/d/WE/data/logs/nginx_error.log;

events {
    worker_connections 1024;
}

http {
    include /home/ahmed/miniforge3/envs/we/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /mnt/d/WE/data/logs/nginx_access.log;
    sendfile on;

    server {
        listen 127.0.0.1:8080;
        server_name _;
        client_max_body_size 25m;

        location / {
            root /mnt/d/WE/frontend/public;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # No trailing slash — see frontend/nginx.conf comment / docs/decisions.md.
            proxy_pass http://127.0.0.1:8020;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding off;
        }
    }
}
