# Overlay: run LLM + ASR on an NVIDIA GPU.
# Usage: docker compose -f compose.yaml -f compose.gpu.yaml up
# The same flags were verified natively on an RTX 3080 (scripts/native_up.sh with LLM_NGL=99,
# ASR_DEVICE=cuda); the Docker overlay itself could not be run there (no Docker in the
# container). The backend image ships CPU-only torch, so in Docker the embedder/reranker
# stay on CPU; the native GPU path runs them on CUDA (EMBED_DEVICE=cuda).

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      --model /models/${LLM_LOCAL_MODEL:-qwen3-4b-q4_k_m}.gguf
      --jinja
      --parallel ${LLM_PARALLEL:-4}
      --ctx-size ${LLM_CTX_TOTAL:-16384}
      --flash-attn on
      --cache-type-k ${LLM_KV_TYPE:-q8_0}
      --cache-type-v ${LLM_KV_TYPE:-q8_0}
      --cache-ram ${LLM_CACHE_RAM:-1024}
      --threads ${LLM_THREADS:-8}
      --n-gpu-layers 99
      --host 0.0.0.0
      --port 8080
      --reasoning off
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  asr:
    build:
      context: ./services/asr
      args:
        DEVICE: cuda
    environment:
      - ASR_MODEL=${ASR_MODEL:-large-v3-turbo}
      - ASR_DEVICE=cuda
      - ASR_COMPUTE_TYPE=float16
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
