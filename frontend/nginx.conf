server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # No trailing slash on proxy_pass's URI: the backend's own routes are rooted at
        # /api/v1 (SPEC.md section 4), so the full incoming path must be forwarded as-is,
        # not have the /api prefix stripped (which `proxy_pass http://backend:8000/;`
        # with a trailing slash would do — caught via real browser testing, see decisions.md).
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
    }
}
